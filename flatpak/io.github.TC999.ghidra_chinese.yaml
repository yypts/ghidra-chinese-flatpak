app-id: io.github.TC999.ghidra_chinese
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: ghidra
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --allow=devel
  - --filesystem=home
  - --env=PATH=/usr/bin:/app/bin:/app/jdk/bin
  - --env=JAVA_HOME=/app/jdk
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/installjdk.sh

  # from flathub: icoutils for extracting icon
  - name: icoutils
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://download.savannah.gnu.org/releases/icoutils/icoutils-0.32.3.tar.bz2
        sha256: 17abe02d043a253b68b47e3af69c9fc755b895db68fdc8811786125df564c6e0
      - type: patch
        path: icoutils-gcc15.patch

  # ---- ghidra ----
  # 依赖策略: CI 阶段1 已运行真实 fetchDependencies.gradle，它会把
  #   z3 jar / fidb / yajsw / postgresql / PyDev / cdt / protobuf / psutil / dex2jar 等全部
  #   放进 dependencies/（含 dependencies/flatRepo）。
  # flathub 官方 manifest 里的 dex2jar/z3/dbgmodel/ghidra-data 独立 source
  #   是它"离线钉死 sha256"的等价替代——我们不需要重复。
  - name: ghidra
    buildsystem: simple
    build-commands:
      - export JAVA_HOME=/usr/lib/sdk/openjdk21/jvm/openjdk-21
      - export PATH="$JAVA_HOME/bin:$PATH"
      # 依赖已 vendor（CI 阶段1真实网络拉取），此处离线 build；maven 依赖走 gradle-home 缓存空的
      # 情况下会联网拉 mavenCentral——沙盒默认无网络, 若失败见 README 已知风险#4
      - ./gradlew buildGhidra --no-daemon
      - unzip -o build/dist/ghidra_*_*_linux_*.zip
      - icotool -x Ghidra/RuntimeScripts/Windows/support/ghidra.ico --index=8
      - install -d /app/lib
      - cp -r ghidra_*/ /app/lib/ghidra
      - install -Dm644 ghidra_8_256x256x32.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm755 ghidra.sh /app/bin/ghidra
      - mv /app/lib/ghidra/support/launch.properties{,.orig}
      - ln -s /var/config/ghidra.properties /app/lib/ghidra/support/launch.properties
      - sed -i 's,bg,fg,' /app/lib/ghidra/ghidraRun
    sources:
      - type: git
        url: https://github.com/TC999/ghidra-chinese.git
        branch: chinese
      # 阶段1产物: 完整 dependencies/ 目录（内含 flatRepo/, downloads/, fidb/, 等）
      - type: archive
        path: ../deps-vendor.tar.gz
        dest: dependencies
        # 解到 ghidra 源码树的 dependencies/, 覆盖/补充同名文件
      - type: file
        path: io.github.TC999.ghidra_chinese.desktop
      - type: script
        dest-filename: ghidra.sh
        commands:
          - "[[ -f /var/config/ghidra.properties ]] || cp /app/lib/ghidra/support/launch.properties.orig /var/config/ghidra.properties"
          - exec /app/lib/ghidra/ghidraRun "$@"
