name: Flatpak 打包 ghidra-chinese

# 触发：chinese 分支 push 或手动
# 结构：两阶段拆两个 job —— 阶段1在普通 ubuntu 装 JDK21 + Gradle 联网拉依赖；
#       阶段2进 flatpak 容器只做离线构建（容器没有系统 java/gradle，SDK 扩展只存在于构建沙盒内）
on:
  push:
    branches: [chinese]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 构建后发 Release
        type: boolean
        default: true

env:
  APP_ID: io.github.TC999.ghidra_chinese

jobs:
  # ---------- 阶段 1：拉取 gradle 依赖（普通 ubuntu，Java 生态齐全） ----------
  fetch-deps:
    name: 阶段1 — Gradle 依赖
    runs-on: ubuntu-24.04
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 取 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: gradle-home
          key: gradle-home-ghidra-chinese
          restore-keys: gradle-home-

      # 你跑到这个 workflow 的仓库只有 flatpak 脚手架（没有 Ghidra 源码），
      # 因此这里必须单独 clone 汉化仓库主分支
      - name: clone ghidra-chinese 源码
        run: git clone --depth 1 -b chinese https://github.com/TC999/ghidra-chinese.git src
        # 若 workflow 就放在 TC999/ghidra-chinese 仓库内, 可改为:
        #   uses: actions/checkout@v4 (即仓库本体, 不 clone)

      - name: gradlew fetchDependencies
        run: |
          cd src
          chmod +x gradlew
          ./gradlew -I gradle/support/fetchDependencies.gradle \
            --no-daemon --gradle-user-home="$GITHUB_WORKSPACE/gradle-home"

      - name: 打包 vendor 归档
        run: |
          cd src
          tar -czf ../deps-vendor.tar.gz dependencies flatRepo
          ls -la ../deps-vendor.tar.gz

      - name: 上传依赖归档
        uses: actions/upload-artifact@v4
        with:
          name: deps-vendor
          path: deps-vendor.tar.gz
          retention-days: 3

  # ---------- 阶段 2：flatpak 容器内离线构建 ----------
  flatpak:
    name: Flatpak 构建 (Linux)
    needs: fetch-deps
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 下载依赖归档
        uses: actions/download-artifact@v4
        with:
          name: deps-vendor
          # 落到 $GITHUB_WORKSPACE（仓库根）；manifest 引用 path: ../deps-vendor.tar.gz（相对 flatpak/ 目录）

      - name: flatpak-builder 构建
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ghidra-chinese.flatpak
          manifest-path: flatpak/io.github.TC999.ghidra_chinese.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          verbose: true

      - name: 重命名产物
        run: mv ghidra-chinese.flatpak ${APP_ID}-${GITHUB_SHA::8}.flatpak

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-chinese-flatpak
          path: ${{ env.APP_ID }}-*.flatpak

  release:
    name: 发行
    needs: flatpak
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 获取日期
        run: echo "CURRENT_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          name: flatpak ${{ env.CURRENT_DATE }} - ${{ github.run_id }}
          tag_name: flatpak-${{ env.CURRENT_DATE }}-${{ github.run_id }}
          files: artifacts/ghidra-chinese-flatpak/*.flatpak
