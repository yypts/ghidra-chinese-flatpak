name: Flatpak 打包 ghidra-chinese

# 触发：chinese 分支有 push，或手动跑
on:
  push:
    branches: [chinese]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 构建后发 Release
        type: boolean
        default: true

env:
  APP_ID: io.github.TC999.ghidra_chinese

jobs:
  flatpak:
    name: Flatpak 构建 (Linux)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示上游 Ghidra 版本
        run: |
          curl -s https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
            | grep '"tag_name"' || true

      - name: 取 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: gradle-home
          key: gradle-home-ghidra-chinese
          restore-keys: gradle-home-

      # ---- 阶段 1：联网 fetch gradle 依赖并 vendor ----
      # 容器自带 freedesktop SDK 的 openjdk21 扩展（/usr/lib/sdk/openjdk21），enable.sh 会设好 JAVA_HOME+PATH
      # gradle 本体下载官方 zip（容器是最小 Fedora 镜像，没有系统 gradle 包）
      - name: 阶段1 — 拉取 Gradle 依赖(flatRepo/dependencies)
        run: |
          set -e
          source /usr/lib/sdk/openjdk21/enable.sh
          java -version

          curl -sfL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          export PATH="/opt/gradle-8.5/bin:$PATH"
          gradle --version

          git clone --depth 1 -b chinese https://github.com/TC999/ghidra-chinese.git _src
          cd _src
          chmod +x gradlew
          ./gradlew -I gradle/support/fetchDependencies.gradle --no-daemon --gradle-user-home="$GITHUB_WORKSPACE/gradle-home"
          tar -czf ../deps-vendor.tar.gz dependencies flatRepo
          ls -la ../deps-vendor.tar.gz

      # ---- 阶段 2：flatpak-builder 离线构建 ----
      # manifest 通过 type:archive path: deps-vendor.tar.gz 挂回 build 目录
      - name: 阶段2 — flatpak-builder 构建
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ghidra-chinese.flatpak
          manifest-path: flatpak/io.github.TC999.ghidra_chinese.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          verbose: true

      - name: 重命名产物
        run: mv ghidra-chinese.flatpak ${APP_ID}-${GITHUB_SHA::8}.flatpak

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-chinese-flatpak
          path: ${{ env.APP_ID }}-*.flatpak

  release:
    name: 发行
    needs: flatpak
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 获取日期
        run: echo "CURRENT_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          name: flatpak ${{ env.CURRENT_DATE }} - ${{ github.run_id }}
          tag_name: flatpak-${{ env.CURRENT_DATE }}-${{ github.run_id }}
          files: artifacts/ghidra-chinese-flatpak/*.flatpak
